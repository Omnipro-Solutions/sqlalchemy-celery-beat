name: Generate Python Library & Publish on PYPI

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build
          
      - name: Get version from setup.py
        id: get_version
        run: |
          VERSION=$(python -c "import re; content=open('setup.py').read(); print(re.search(r'version=[\"\\x27]([^\"\\x27]+)[\"\\x27]', content).group(1))")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: v${VERSION}"

      - name: Build package
        run: python -m build

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

      - name: Publish package to Custom PYPI
        run: |
          pip install twine
          twine upload --repository-url https://pypi.omni.pro/root/omni-pro/ -u ${{ secrets.DEVPI_USER }} -p ${{ secrets.DEVPI_PASSWORD }} dist/*